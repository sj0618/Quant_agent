name: Deploy to SSH Server

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: quant-agent-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install dependencies
        working-directory: fe
        run: npm ci

      - name: Build
        working-directory: fe
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 30233 quant-agent.kro.kr >> ~/.ssh/known_hosts

      - name: Create deploy directory on server
        run: |
          ssh -i ~/.ssh/id_rsa -p 30233 etluser@quant-agent.kro.kr \
            "mkdir -p ~/mvp_sp1/quant-proj"

      - name: Deploy via rsync
        run: |
          rsync -rlvvz --delete --stats \
            --old-args \
            --omit-dir-times \
            --no-perms --no-owner --no-group \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='DE/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='**/__pycache__/' \
            --exclude='**/*.pyc' \
            --exclude='**/logs/' \
            --exclude='**/.pytest_cache/' \
            --exclude='ai/.venv/' \
            -e "ssh -v -i ~/.ssh/id_rsa -p 30233" \
            ./ \
            etluser@quant-agent.kro.kr:~/mvp_sp1/quant-proj/

      - name: Install and restart development servers
        run: |
          ssh -i ~/.ssh/id_rsa -p 30233 etluser@quant-agent.kro.kr \
            bash -s -- "$GITHUB_SHA" <<'REMOTE'
            set -euo pipefail

            DEPLOYMENT_REVISION="$1"
            if [ -f "$HOME/.bashrc" ]; then
              set +u
              source "$HOME/.bashrc"
              set -u
            fi

            APP_DIR="$HOME/mvp_sp1/quant-proj"
            RUN_DIR="$APP_DIR/.run"
            mkdir -p "$RUN_DIR"

            python3.11 -m venv "$APP_DIR/ai/.venv"
            "$APP_DIR/ai/.venv/bin/python" -m pip install --upgrade pip setuptools wheel
            "$APP_DIR/ai/.venv/bin/python" -m pip install -e "$APP_DIR/ai"

            "$APP_DIR/ai/.venv/bin/python" - "$APP_DIR" <<'PY'
          import os
          import sys
          from pathlib import Path

          import psycopg

          from ai_graph.data_sources.db import resolve_database_dsn_from_env

          app_dir = Path(sys.argv[1])
          dsn, _ = resolve_database_dsn_from_env()
          if not dsn:
              raise RuntimeError("database DSN is required for AI audit migrations")
          with psycopg.connect(dsn, autocommit=True) as conn:
              for name in (
                  "011_app_ai_backtest_erd.sql",
                  "013_ai_runtime_logging.sql",
                  "019_ai_prompt_response_summary.sql",
              ):
                  conn.execute(
                      (app_dir / "service_db" / "migrations" / name).read_text(
                          encoding="utf-8"
                      )
                  )
                  print(f"applied {name}")
          PY

            umask 077
            AUDIT_SECRET_FILE="$RUN_DIR/ai-audit-admission.secret"
            if [ ! -s "$AUDIT_SECRET_FILE" ]; then
              openssl rand -hex 32 > "$AUDIT_SECRET_FILE"
            fi
            chmod 600 "$AUDIT_SECRET_FILE"
            export APP_ENV=production
            export AI_AUDIT_PRODUCTION_ENABLED=1
            export AI_AUDIT_SINK=postgres
            export AI_AUDIT_GATE_B_ADMISSION_HMAC_SECRET
            AI_AUDIT_GATE_B_ADMISSION_HMAC_SECRET="$(tr -d '\r\n' < "$AUDIT_SECRET_FILE")"
            export AI_AUDIT_GATE_B_ADMISSION_HMAC_KEY_VERSION=server-v1
            export AI_AUDIT_GATE_B_ADMISSION_AUDIENCE=quantagent.ai.audit
            export AI_AUDIT_GATE_B_EVIDENCE_ID=production-deployment
            export AI_AUDIT_GATE_B_DEPLOYMENT_REVISION="$DEPLOYMENT_REVISION"
            export AI_AUDIT_GATE_B_ADMISSION_REVOCATION_STATE=active
            export AI_AUDIT_GATE_B_ADMISSION_TOKEN
            AI_AUDIT_GATE_B_ADMISSION_TOKEN="$("$APP_DIR/ai/.venv/bin/python" - <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import os
          import time

          def encode(value):
              raw = json.dumps(value, separators=(",", ":"), sort_keys=True).encode()
              return base64.urlsafe_b64encode(raw).rstrip(b"=").decode()

          now = time.time()
          key_version = os.environ["AI_AUDIT_GATE_B_ADMISSION_HMAC_KEY_VERSION"]
          header = {"alg": "HS256", "key_version": key_version}
          claims = {
              "audience": os.environ["AI_AUDIT_GATE_B_ADMISSION_AUDIENCE"],
              "deployment_revision": os.environ[
                  "AI_AUDIT_GATE_B_DEPLOYMENT_REVISION"
              ],
              "evidence_id": os.environ["AI_AUDIT_GATE_B_EVIDENCE_ID"],
              "expiry": now + 365 * 24 * 60 * 60,
              "issued_at": now - 1,
              "key_version": key_version,
          }
          signing_input = f"{encode(header)}.{encode(claims)}"
          signature = hmac.new(
              os.environ["AI_AUDIT_GATE_B_ADMISSION_HMAC_SECRET"].encode(),
              signing_input.encode("ascii"),
              hashlib.sha256,
          ).digest()
          print(
              f"{signing_input}."
              f"{base64.urlsafe_b64encode(signature).rstrip(b'=').decode()}"
          )
          PY
            )"

            "$APP_DIR/ai/.venv/bin/python" - <<'PY'
          from ai_graph.audit_postgres import AuthorizedAuditSink, create_audit_sink_from_env

          if not isinstance(create_audit_sink_from_env(), AuthorizedAuditSink):
              raise RuntimeError("production AI audit admission was not authorized")
          print("production AI audit admission authorized")
          PY

            cd "$APP_DIR/fe"
            npm ci

            stop_listeners_on_port() {
              local port="$1"

              find_listener_pids_on_port() {
                local target_port="$1"
                ss -H -ltnp "sport = :$target_port" 2>/dev/null \
                  | grep -oE 'pid=[0-9]+' \
                  | cut -d= -f2 \
                  | sort -u \
                  || true
              }

              for attempt in $(seq 1 5); do
                local pids
                pids="$(find_listener_pids_on_port "$port")"

                if [ -z "$pids" ]; then
                  echo "No listener found on port $port"
                  return 0
                fi

                echo "Stopping listener(s) on port $port, attempt $attempt: $pids"
                for pid in $pids; do
                  kill "$pid" 2>/dev/null || true
                done

                for _ in $(seq 1 5); do
                  if [ -z "$(find_listener_pids_on_port "$port")" ]; then
                    return 0
                  fi
                  sleep 1
                done

                pids="$(find_listener_pids_on_port "$port")"
                echo "Force stopping listener(s) on port $port: $pids"
                for pid in $pids; do
                  kill -9 "$pid" 2>/dev/null || true
                done
                sleep 1
              done

              echo "Port $port is still occupied after stop attempts"
              ss -H -ltnp "sport = :$port" 2>/dev/null || true
              return 1
            }

            stop_listeners_on_port 18001
            stop_listeners_on_port 18000
            rm -f "$RUN_DIR/ai.pid" "$RUN_DIR/fe.pid"

            cd "$APP_DIR/ai"
            nohup "$APP_DIR/ai/.venv/bin/python" -m uvicorn ai_graph.api:app \
              --host 0.0.0.0 \
              --port 18001 \
              --reload \
              > "$RUN_DIR/ai.log" 2>&1 &
            echo "$!" > "$RUN_DIR/ai.pid"

            cd "$APP_DIR/fe"
            nohup npm run dev -- --host 0.0.0.0 --port 18000 \
              > "$RUN_DIR/fe.log" 2>&1 &
            echo "$!" > "$RUN_DIR/fe.pid"

            wait_for_url() {
              local name="$1"
              local url="$2"
              local log_file="$3"
              for _ in $(seq 1 30); do
                if curl -fsS "$url" >/dev/null 2>&1; then
                  echo "$name is ready: $url"
                  return 0
                fi
                sleep 2
              done
              echo "$name did not become ready: $url"
              tail -n 80 "$log_file" || true
              return 1
            }

            wait_for_url "AI API" "http://127.0.0.1:18001/health" "$RUN_DIR/ai.log"
            wait_for_url "FE dev server" "http://127.0.0.1:18000/" "$RUN_DIR/fe.log"
          REMOTE
