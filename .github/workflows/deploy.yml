name: Deploy to SSH Server

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: quant-agent-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install dependencies
        working-directory: fe
        run: npm ci

      - name: Build
        working-directory: fe
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 30233 quant-agent.kro.kr >> ~/.ssh/known_hosts

      - name: Create deploy directory on server
        run: |
          ssh -i ~/.ssh/id_rsa -p 30233 etluser@quant-agent.kro.kr \
            "mkdir -p ~/mvp_sp1/quant-proj"

      - name: Deploy via rsync
        run: |
          rsync -rlvvz --delete --stats \
            --old-args \
            --omit-dir-times \
            --no-perms --no-owner --no-group \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='**/__pycache__/' \
            --exclude='**/*.pyc' \
            --exclude='**/logs/' \
            --exclude='**/.pytest_cache/' \
            --exclude='ai/.venv/' \
            -e "ssh -v -i ~/.ssh/id_rsa -p 30233" \
            ./ \
            etluser@quant-agent.kro.kr:~/mvp_sp1/quant-proj/

      - name: Install and restart development servers
        run: |
          ssh -i ~/.ssh/id_rsa -p 30233 etluser@quant-agent.kro.kr <<'REMOTE'
            set -euo pipefail

            if [ -f "$HOME/.bashrc" ]; then
              set +u
              source "$HOME/.bashrc"
              set -u
            fi

            APP_DIR="$HOME/mvp_sp1/quant-proj"
            RUN_DIR="$APP_DIR/.run"
            mkdir -p "$RUN_DIR"
            export AUTH_ENABLED="${AUTH_ENABLED:-1}" AI_JOB_STORE=memory AI_AUDIT_SINK=noop
            if [ "$AUTH_ENABLED" = "1" ]; then
              : "${REDIS_URL:?REDIS_URL must be configured when AUTH_ENABLED=1}"
              : "${VITE_AUTH_API_BASE_URL:?VITE_AUTH_API_BASE_URL must be configured for Google login}"
              export REDIS_URL VITE_AUTH_API_BASE_URL
            fi
            export VITE_AI_API_BASE_URL=/ai-api
            if [ "${AI_LLM_PROVIDER:-}" != "aoai" ]; then
              echo "AI_LLM_PROVIDER=aoai must be configured on the deploy server"
              exit 1
            fi
            : "${AI_AOAI_RESPONSES_URL:?AI_AOAI_RESPONSES_URL must be configured on the deploy server}"
            : "${AI_AOAI_API_KEY:?AI_AOAI_API_KEY must be configured on the deploy server}"
            : "${AI_AOAI_MODEL:?AI_AOAI_MODEL must be configured on the deploy server}"
            export AI_LLM_PROVIDER AI_AOAI_RESPONSES_URL AI_AOAI_API_KEY AI_AOAI_MODEL
            has_non_whitespace() {
              case "$1" in
                *[![:space:]]*) return 0 ;;
                *) return 1 ;;
              esac
            }
            if has_non_whitespace "${AI_DATABASE_DSN:-}"; then
              export AI_DATABASE_DSN
            elif has_non_whitespace "${QUANT_DB_DSN:-}"; then
              export QUANT_DB_DSN
            elif has_non_whitespace "${DATABASE_URL:-}"; then
              export DATABASE_URL
            else
              echo "AI_DATABASE_DSN, QUANT_DB_DSN, or DATABASE_URL must be configured on the deploy server"
              exit 1
            fi

            python3.11 -m venv "$APP_DIR/ai/.venv"
            "$APP_DIR/ai/.venv/bin/python" -m pip install --upgrade pip setuptools wheel
            "$APP_DIR/ai/.venv/bin/python" -m pip install -e "$APP_DIR/backtest_module" -e "$APP_DIR/ai"
            if [ "$AUTH_ENABLED" = "1" ]; then
              "$APP_DIR/ai/.venv/bin/python" -c \
                'import os; from redis import Redis; client = Redis.from_url(os.environ["REDIS_URL"]); assert client.ping(), "Redis ping failed"; client.close()'
              curl -fsS --max-time 15 "${VITE_AUTH_API_BASE_URL%/}/health" \
                | "$APP_DIR/ai/.venv/bin/python" -c \
                  'import json, sys; status = json.load(sys.stdin); assert status.get("status") == "ok" and status.get("component") == "backend", "auth backend health check failed"'
            else
              echo "AUTH_ENABLED=0: skipping Redis ping and auth backend health check"
            fi
            timeout 1200 "$APP_DIR/ai/.venv/bin/python" -c \
              'from ai_graph import run_analysis; result = run_analysis("005930 RSI가 30 이하이면 매수하고 70 이상이면 매도"); assert result.status == "ready", "live analysis smoke test did not finish ready"'

            cd "$APP_DIR/fe"
            npm ci
            npm run build

            stop_listeners_on_port() {
              local port="$1"

              find_listener_pids_on_port() {
                local target_port="$1"
                ss -H -ltnp "sport = :$target_port" 2>/dev/null \
                  | grep -oE 'pid=[0-9]+' \
                  | cut -d= -f2 \
                  | sort -u \
                  || true
              }

              for attempt in $(seq 1 5); do
                local pids
                pids="$(find_listener_pids_on_port "$port")"

                if [ -z "$pids" ]; then
                  echo "No listener found on port $port"
                  return 0
                fi

                echo "Stopping listener(s) on port $port, attempt $attempt: $pids"
                for pid in $pids; do
                  kill "$pid" 2>/dev/null || true
                done

                for _ in $(seq 1 5); do
                  if [ -z "$(find_listener_pids_on_port "$port")" ]; then
                    return 0
                  fi
                  sleep 1
                done

                pids="$(find_listener_pids_on_port "$port")"
                echo "Force stopping listener(s) on port $port: $pids"
                for pid in $pids; do
                  kill -9 "$pid" 2>/dev/null || true
                done
                sleep 1
              done

              echo "Port $port is still occupied after stop attempts"
              ss -H -ltnp "sport = :$port" 2>/dev/null || true
              return 1
            }

            stop_listeners_on_port 18001
            stop_listeners_on_port 18000
            rm -f "$RUN_DIR/ai.pid" "$RUN_DIR/fe.pid"

            cd "$APP_DIR/ai"
            nohup "$APP_DIR/ai/.venv/bin/python" -m uvicorn ai_graph.api:app \
              --host 0.0.0.0 \
              --port 18001 \
              > "$RUN_DIR/ai.log" 2>&1 &
            echo "$!" > "$RUN_DIR/ai.pid"

            cd "$APP_DIR/fe"
            nohup npm run preview -- --host 0.0.0.0 --port 18000 \
              > "$RUN_DIR/fe.log" 2>&1 &
            echo "$!" > "$RUN_DIR/fe.pid"

            wait_for_url() {
              local name="$1"
              local url="$2"
              local log_file="$3"
              for _ in $(seq 1 30); do
                if curl -fsS "$url" >/dev/null 2>&1; then
                  echo "$name is ready: $url"
                  return 0
                fi
                sleep 2
              done
              echo "$name did not become ready: $url"
              tail -n 80 "$log_file" || true
              return 1
            }

            wait_for_url "AI API" "http://127.0.0.1:18001/health" "$RUN_DIR/ai.log"
            curl -fsS http://127.0.0.1:18001/api-status \
              | "$APP_DIR/ai/.venv/bin/python" -c \
                'import json, sys; status = json.load(sys.stdin); assert status["data_source"]["configured"], "database DSN is not active"'
            wait_for_url "FE dev server" "http://127.0.0.1:18000/" "$RUN_DIR/fe.log"
          REMOTE
