name: Deploy to SSH Server

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: quant-agent-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install dependencies
        working-directory: fe
        run: npm ci

      - name: Build
        working-directory: fe
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 30233 quant-agent.kro.kr >> ~/.ssh/known_hosts

      - name: Create deploy directory on server
        run: |
          ssh -i ~/.ssh/id_rsa -p 30233 etluser@quant-agent.kro.kr \
            "mkdir -p ~/mvp_sp1/quant-proj"

      - name: Deploy via rsync
        run: |
          rsync -rlvvz --delete --stats \
            --old-args \
            --omit-dir-times \
            --no-perms --no-owner --no-group \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='**/__pycache__/' \
            --exclude='**/*.pyc' \
            --exclude='**/logs/' \
            --exclude='**/.pytest_cache/' \
            --exclude='ai/.venv/' \
            -e "ssh -v -i ~/.ssh/id_rsa -p 30233" \
            ./ \
            etluser@quant-agent.kro.kr:~/mvp_sp1/quant-proj/

      - name: Install and restart development servers
        run: |
          ssh -i ~/.ssh/id_rsa -p 30233 etluser@quant-agent.kro.kr <<'REMOTE'
            set -euo pipefail

            if [ -f "$HOME/.bashrc" ]; then
              set +u
              source "$HOME/.bashrc"
              set -u
            fi

            APP_DIR="$HOME/mvp_sp1/quant-proj"
            RUN_DIR="$APP_DIR/.run"
            mkdir -p "$RUN_DIR"
            # Production MVP requires AOAI and PostgreSQL-backed data; no fixture fallback is allowed.
            export AUTH_ENABLED=0 AI_JOB_STORE=memory AI_AUDIT_SINK=noop AI_REQUIRE_LIVE_DATA=1 BACKEND_FE_DATA_SOURCE=database
            : "${AI_LLM_PROVIDER:?AI_LLM_PROVIDER must be set to aoai in the remote shell environment}"
            [ "$AI_LLM_PROVIDER" = "aoai" ]
            : "${AI_AOAI_RESPONSES_URL:?AI_AOAI_RESPONSES_URL is required}"
            : "${AI_AOAI_API_KEY:?AI_AOAI_API_KEY is required}"
            : "${AI_AOAI_MODEL:?AI_AOAI_MODEL is required}"
            # Reuse the data DB DSN injected into the Airflow worker; never use its metadata DB.
            if [ -z "${DATABASE_URL:-}" ] && [ -n "${QUANT_DB_DSN:-}" ]; then
              DATABASE_URL="$QUANT_DB_DSN"
            fi
            if [ -z "${DATABASE_URL:-}" ]; then
              DATABASE_URL="$(docker exec de-airflow-worker-1 sh -lc 'printf "%s" "${QUANT_DB_DSN:-}"' 2>/dev/null || true)"
            fi
            : "${DATABASE_URL:?DATABASE_URL is required for live backend and AI data}"
            export AI_LLM_PROVIDER AI_AOAI_RESPONSES_URL AI_AOAI_API_KEY AI_AOAI_MODEL DATABASE_URL
            unset AUTH_SESSION_COOKIE_NAME AI_CORS_ALLOW_ORIGINS

            python3.11 -m venv "$APP_DIR/ai/.venv"
            "$APP_DIR/ai/.venv/bin/python" -m pip install --upgrade pip setuptools wheel
            "$APP_DIR/ai/.venv/bin/python" -m pip install -e "$APP_DIR/ai"
            "$APP_DIR/ai/.venv/bin/python" -m pip install -e "$APP_DIR/backend"

            cd "$APP_DIR/fe"
            npm ci

            stop_listeners_on_port() {
              local port="$1"

              find_listener_pids_on_port() {
                local target_port="$1"
                ss -H -ltnp "sport = :$target_port" 2>/dev/null \
                  | grep -oE 'pid=[0-9]+' \
                  | cut -d= -f2 \
                  | sort -u \
                  || true
              }

              for attempt in $(seq 1 5); do
                local pids
                pids="$(find_listener_pids_on_port "$port")"

                if [ -z "$pids" ]; then
                  echo "No listener found on port $port"
                  return 0
                fi

                echo "Stopping listener(s) on port $port, attempt $attempt: $pids"
                for pid in $pids; do
                  kill "$pid" 2>/dev/null || true
                done

                for _ in $(seq 1 5); do
                  if [ -z "$(find_listener_pids_on_port "$port")" ]; then
                    return 0
                  fi
                  sleep 1
                done

                pids="$(find_listener_pids_on_port "$port")"
                echo "Force stopping listener(s) on port $port: $pids"
                for pid in $pids; do
                  kill -9 "$pid" 2>/dev/null || true
                done
                sleep 1
              done

              echo "Port $port is still occupied after stop attempts"
              ss -H -ltnp "sport = :$port" 2>/dev/null || true
              return 1
            }

            stop_listeners_on_port 18001
            stop_listeners_on_port 8000
            stop_listeners_on_port 18000
            rm -f "$RUN_DIR/ai.pid" "$RUN_DIR/fe.pid"
            rm -f "$RUN_DIR/backend.pid"

            cd "$APP_DIR/ai"
            nohup "$APP_DIR/ai/.venv/bin/python" -m uvicorn ai_graph.api:app \
              --host 0.0.0.0 \
              --port 18001 \
              --reload \
              > "$RUN_DIR/ai.log" 2>&1 &
            echo "$!" > "$RUN_DIR/ai.pid"
            cd "$APP_DIR/backend"
            nohup "$APP_DIR/ai/.venv/bin/python" -m uvicorn app.main:app \
              --host 0.0.0.0 \
              --port 8000 \
              > "$RUN_DIR/backend.log" 2>&1 &
            echo "$!" > "$RUN_DIR/backend.pid"

            cd "$APP_DIR/fe"
            nohup npm run dev -- --host 0.0.0.0 --port 18000 \
              > "$RUN_DIR/fe.log" 2>&1 &
            echo "$!" > "$RUN_DIR/fe.pid"

            wait_for_url() {
              local name="$1"
              local url="$2"
              local log_file="$3"
              for _ in $(seq 1 30); do
                if curl -fsS "$url" >/dev/null 2>&1; then
                  echo "$name is ready: $url"
                  return 0
                fi
                sleep 2
              done
              echo "$name did not become ready: $url"
              tail -n 80 "$log_file" || true
              return 1
            }

            wait_for_url "AI API" "http://127.0.0.1:18001/health" "$RUN_DIR/ai.log"
            wait_for_url "Backend API" "http://127.0.0.1:8000/app/overview" "$RUN_DIR/backend.log"
            backend_status="$(curl -fsS "http://127.0.0.1:8000/api-status")"
            BACKEND_STATUS_JSON="$backend_status" python3.11 -c 'import json, os; source = json.loads(os.environ["BACKEND_STATUS_JSON"])["data_source"]; assert source["configured"] and source["price_source"] == "feature.kis_adjusted_ohlcv_daily", source'
            echo "Backend API is using PostgreSQL-backed live data"
            wait_for_url "FE dev server" "http://127.0.0.1:18000/" "$RUN_DIR/fe.log"
          REMOTE
