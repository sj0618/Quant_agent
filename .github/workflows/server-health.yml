name: Server health check

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
  workflow_run:
    workflows:
      - Deploy to SSH Server
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: server-health-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    name: Verify deployed server
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST || 'quant-agent.kro.kr' }}
      SERVER_PORT: ${{ secrets.SERVER_PORT || '30233' }}
      SERVER_USER: ${{ secrets.SERVER_USER || 'etluser' }}
      SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR || '/home/etluser/mvp_sp1/quant-proj' }}
      AI_PORT: "18001"
      FE_PORT: "18000"

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_admin"
          chmod 600 "$HOME/.ssh/id_admin"
          ssh-keyscan -T 10 -p "$SERVER_PORT" "$SERVER_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Check remote processes and endpoints
        run: |
          ssh -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/id_admin" \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            bash -s -- "$SERVER_APP_DIR" "$AI_PORT" "$FE_PORT" <<'REMOTE'
          set -Eeuo pipefail

          APP_DIR="$1"
          AI_PORT="$2"
          FE_PORT="$3"
          RUN_DIR="$APP_DIR/.run"

          test -d "$APP_DIR"
          test -x "$APP_DIR/ai/.venv/bin/python"
          test -s "$RUN_DIR/ai.pid"
          test -s "$RUN_DIR/fe.pid"

          check_pid() {
            local label="$1"
            local pid_file="$2"
            local pid
            pid="$(cat "$pid_file")"
            [[ "$pid" =~ ^[1-9][0-9]*$ ]]
            kill -0 "$pid"
            printf '%s process is alive: pid=%s\n' "$label" "$pid"
          }

          check_listener() {
            local label="$1"
            local port="$2"
            local rows
            rows="$(ss -H -ltn "sport = :$port")"
            test -n "$rows"
            printf '%s listener is present on port %s\n' "$label" "$port"
          }

          check_http() {
            local label="$1"
            local url="$2"
            local body
            body="$(mktemp)"
            trap 'rm -f "$body"' RETURN
            curl -q --fail --silent --show-error \
              --connect-timeout 5 --max-time 15 \
              -o "$body" "$url"
            test -s "$body"
            printf '%s endpoint is healthy: %s\n' "$label" "$url"
          }

          check_pid "AI" "$RUN_DIR/ai.pid"
          check_pid "FE" "$RUN_DIR/fe.pid"
          check_listener "AI" "$AI_PORT"
          check_listener "FE" "$FE_PORT"
          check_http "AI" "http://127.0.0.1:$AI_PORT/health"
          check_http "FE" "http://127.0.0.1:$FE_PORT/"

          if command -v git >/dev/null 2>&1 && git -C "$APP_DIR" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            printf 'deployed revision: %s\n' "$(git -C "$APP_DIR" rev-parse --short HEAD)"
          fi
          REMOTE

      - name: Remove SSH credential
        if: always()
        run: rm -f -- "$HOME/.ssh/id_admin"

  branch-db:
    name: Verify branch with isolated server DB access
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    needs: health
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST || 'quant-agent.kro.kr' }}
      SERVER_PORT: ${{ secrets.SERVER_PORT || '30233' }}
      SERVER_USER: ${{ secrets.SERVER_USER || 'etluser' }}
      SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR || '/home/etluser/mvp_sp1/quant-proj' }}
      DB_CONTAINER: quant-agent-db
      DB_VOLUME: quant-agent-pgdata
      LOCAL_DB_PORT: "15432"

    steps:
      - name: Prepare restricted DB tunnel and read-only role
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_admin"
          chmod 600 "$HOME/.ssh/id_admin"
          trap 'rm -f -- "$HOME/.ssh/id_admin"' EXIT
          ssh-keyscan -T 10 -p "$SERVER_PORT" "$SERVER_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

          ROLE_NAME="codex_read_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          ROLE_PASSWORD="$(openssl rand -hex 24)"
          TUNNEL_MARKER="codex-db-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ "$ROLE_NAME" =~ ^codex_read_[0-9_]+$ ]]
          [[ "$TUNNEL_MARKER" =~ ^codex-db-[0-9-]+$ ]]
          echo "::add-mask::$ROLE_PASSWORD"

          ssh-keygen -q -t ed25519 -N '' -C "$TUNNEL_MARKER" -f "$HOME/.ssh/id_db_tunnel"
          PUBLIC_KEY_B64="$(base64 -w0 < "$HOME/.ssh/id_db_tunnel.pub")"

          DB_NAME="$(ssh -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/id_admin" \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            bash -s -- \
              "$SERVER_APP_DIR" "$DB_CONTAINER" "$DB_VOLUME" \
              "$ROLE_NAME" "$ROLE_PASSWORD" "$TUNNEL_MARKER" "$PUBLIC_KEY_B64" <<'REMOTE'
          set -Eeuo pipefail
          APP_DIR="$1"
          DB_CONTAINER="$2"
          DB_VOLUME="$3"
          ROLE_NAME="$4"
          ROLE_PASSWORD="$5"
          TUNNEL_MARKER="$6"
          PUBLIC_KEY_B64="$7"
          [[ "$DB_CONTAINER" =~ ^[A-Za-z0-9_.-]+$ ]]
          [[ "$DB_VOLUME" =~ ^[A-Za-z0-9_.-]+$ ]]
          [[ "$ROLE_NAME" =~ ^codex_read_[0-9_]+$ ]]
          [[ "$TUNNEL_MARKER" =~ ^codex-db-[0-9-]+$ ]]

          if ! docker container inspect "$DB_CONTAINER" >/dev/null 2>&1; then
            docker volume inspect "$DB_VOLUME" >/dev/null
            test -s "$APP_DIR/DE/.env"
            test -s "$APP_DIR/DE/compose.yaml"
            docker compose \
              --env-file "$APP_DIR/DE/.env" \
              -f "$APP_DIR/DE/compose.yaml" \
              up -d db >&2
          elif [ "$(docker inspect -f '{{.State.Running}}' "$DB_CONTAINER")" != true ]; then
            docker start "$DB_CONTAINER" >&2
          fi

          for _ in $(seq 1 60); do
            STATUS="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$DB_CONTAINER")"
            if [ "$STATUS" = healthy ] || [ "$STATUS" = running ]; then
              break
            fi
            sleep 2
          done
          STATUS="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$DB_CONTAINER")"
          { [ "$STATUS" = healthy ] || [ "$STATUS" = running ]; }

          DB_USER="$(docker exec "$DB_CONTAINER" printenv POSTGRES_USER)"
          DB_NAME="$(docker exec "$DB_CONTAINER" printenv POSTGRES_DB)"
          [[ "$DB_NAME" =~ ^[A-Za-z0-9_]+$ ]]
          docker exec -i "$DB_CONTAINER" psql -X -q -v ON_ERROR_STOP=1 \
            -U "$DB_USER" -d "$DB_NAME" \
            -v role_name="$ROLE_NAME" -v role_password="$ROLE_PASSWORD" <<'SQL'
          SELECT format(
            'CREATE ROLE %I LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS CONNECTION LIMIT 4 VALID UNTIL %L',
            :'role_name', :'role_password', now() + interval '45 minutes'
          ) \gexec
          SELECT format('ALTER ROLE %I SET default_transaction_read_only = on', :'role_name') \gexec
          SELECT format('ALTER ROLE %I SET statement_timeout = %L', :'role_name', '120s') \gexec
          SELECT format('GRANT CONNECT ON DATABASE %I TO %I', current_database(), :'role_name') \gexec
          SELECT format('GRANT USAGE ON SCHEMA meta, feature, raw, mart TO %I', :'role_name') \gexec
          SELECT format(
            'GRANT SELECT ON meta.view_common_stock_universe, feature.kis_adjusted_ohlcv_daily, feature.ta_momentum_ticker_daily, raw.analyst_report_summary, mart.bok_macro_asof TO %I',
            :'role_name'
          ) \gexec
          SQL

          PUBLIC_KEY="$(printf '%s' "$PUBLIC_KEY_B64" | base64 -d)"
          case "$PUBLIC_KEY" in
            ssh-ed25519*" $TUNNEL_MARKER") ;;
            *) exit 1 ;;
          esac
          AUTHORIZED_KEYS="$HOME/.ssh/authorized_keys"
          touch "$AUTHORIZED_KEYS"
          chmod 600 "$AUTHORIZED_KEYS"
          AUTHORIZED_KEYS_TMP="$(mktemp "$HOME/.ssh/authorized_keys.codex.XXXXXX")"
          awk -v marker="$TUNNEL_MARKER" '$NF != marker' "$AUTHORIZED_KEYS" > "$AUTHORIZED_KEYS_TMP"
          printf 'command="/bin/false",restrict,port-forwarding,permitopen="127.0.0.1:5432" %s\n' "$PUBLIC_KEY" >> "$AUTHORIZED_KEYS_TMP"
          chmod 600 "$AUTHORIZED_KEYS_TMP"
          mv "$AUTHORIZED_KEYS_TMP" "$AUTHORIZED_KEYS"

          printf '%s\n' "$DB_NAME"
          REMOTE
          )"
          [[ "$DB_NAME" =~ ^[A-Za-z0-9_]+$ ]]

          {
            printf 'BRANCH_DB_USER=%s\n' "$ROLE_NAME"
            printf 'BRANCH_DB_PASSWORD=%s\n' "$ROLE_PASSWORD"
            printf 'BRANCH_DB_NAME=%s\n' "$DB_NAME"
            printf 'TUNNEL_MARKER=%s\n' "$TUNNEL_MARKER"
          } >> "$GITHUB_ENV"

      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ai/pyproject.toml
            backtest_module/pyproject.toml

      - name: Install branch analysis packages
        run: python -m pip install -e ./backtest_module -e ./ai

      - name: Verify full-universe branch analysis through read-only tunnel
        env:
          AI_LLM_PROVIDER: mock
          AI_AUDIT_SINK: noop
          AI_BACKTEST_LOOKBACK_DAYS: "252"
          AI_DB_STATEMENT_TIMEOUT_MS: "120000"
        run: |
          set -Eeuo pipefail
          test ! -e "$HOME/.ssh/id_admin"
          ssh -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/id_db_tunnel" \
            -p "$SERVER_PORT" \
            -N -L "127.0.0.1:$LOCAL_DB_PORT:127.0.0.1:5432" \
            "$SERVER_USER@$SERVER_HOST" &
          TUNNEL_PID=$!
          trap 'kill "$TUNNEL_PID" 2>/dev/null || true; wait "$TUNNEL_PID" 2>/dev/null || true' EXIT

          python - <<'PY'
          import json
          import os
          import socket
          import time

          import psycopg
          from psycopg.conninfo import make_conninfo

          from ai_graph.graph import DEBUG_STORE, run_analysis

          deadline = time.monotonic() + 20
          while True:
              try:
                  with socket.create_connection(
                      ("127.0.0.1", int(os.environ["LOCAL_DB_PORT"])), timeout=1
                  ):
                      break
              except OSError:
                  if time.monotonic() >= deadline:
                      raise
                  time.sleep(0.5)

          os.environ["AI_DATABASE_DSN"] = make_conninfo(
              host="127.0.0.1",
              port=int(os.environ["LOCAL_DB_PORT"]),
              dbname=os.environ["BRANCH_DB_NAME"],
              user=os.environ["BRANCH_DB_USER"],
              password=os.environ["BRANCH_DB_PASSWORD"],
              options="-c default_transaction_read_only=on -c statement_timeout=120000",
          )
          with psycopg.connect(os.environ["AI_DATABASE_DSN"]) as connection:
              role_status = connection.execute(
                  """
                  SELECT current_setting('transaction_read_only'), rolsuper,
                         rolcreatedb, rolcreaterole, rolreplication, rolbypassrls
                  FROM pg_roles WHERE rolname = current_user
                  """
              ).fetchone()
              assert role_status == ("on", False, False, False, False, False)
              can_insert_prices = connection.execute(
                  """
                  SELECT has_table_privilege(
                      current_user,
                      'feature.kis_adjusted_ohlcv_daily',
                      'INSERT'
                  )
                  """
              ).fetchone()[0]
              assert not can_insert_prices
              universe_count = connection.execute(
                  "SELECT count(*) FROM meta.view_common_stock_universe"
              ).fetchone()[0]
              price_status = connection.execute(
                  """
                  SELECT count(*), count(DISTINCT ticker), min(time), max(time)
                  FROM feature.kis_adjusted_ohlcv_daily
                  """
              ).fetchone()

          assert universe_count > 1
          assert price_status[1] > 1

          envelope = run_analysis(
              "RSI가 35 이하인 전체 종목을 찾아줘",
              trace_id="branch-db-analysis",
          )
          assert envelope.status.value == "ready"
          assert envelope.source_usage
          assert all(usage.source_type == "internal_db" for usage in envelope.source_usage)
          assert not any(usage.fallback_used for usage in envelope.source_usage)
          assert all(usage.freshness_status == "unknown" for usage in envelope.source_usage)
          debug_payload = DEBUG_STORE.get(envelope.debug_ref).model_dump(mode="json")
          pipeline_metadata = debug_payload["node_outputs"]["data"]["pipeline_data_source"]
          backtest_payload = debug_payload["backtest_artifacts"]["backtest_payload"]
          loaded_tickers = len(pipeline_metadata["tickers"])
          backtest_tickers = len(backtest_payload["tickers"])
          assert pipeline_metadata["source"] == "postgres"
          assert loaded_tickers > 1
          assert pipeline_metadata["screening_candidates"] == loaded_tickers
          assert backtest_tickers == loaded_tickers

          print(json.dumps({
              "database_configured": True,
              "database_role_read_only": True,
              "universe_count": universe_count,
              "price_rows": price_status[0],
              "price_tickers": price_status[1],
              "price_first_date": str(price_status[2]),
              "price_last_date": str(price_status[3]),
              "screening_candidates": pipeline_metadata["screening_candidates"],
              "loaded_tickers": loaded_tickers,
              "loaded_price_rows": pipeline_metadata["price_rows"],
              "analysis_status": envelope.status.value,
              "backtest_tickers": backtest_tickers,
              "backtest_price_rows": backtest_payload["price_rows"],
              "source_types": sorted({usage.source_type for usage in envelope.source_usage}),
              "freshness_statuses": sorted({usage.freshness_status for usage in envelope.source_usage}),
              "fallback_used": any(usage.fallback_used for usage in envelope.source_usage),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Revoke temporary server access
        if: always()
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_admin_cleanup"
          chmod 600 "$HOME/.ssh/id_admin_cleanup"
          trap 'rm -f -- "$HOME/.ssh/id_admin_cleanup" "$HOME/.ssh/id_db_tunnel" "$HOME/.ssh/id_db_tunnel.pub"' EXIT
          ssh-keyscan -T 10 -p "$SERVER_PORT" "$SERVER_HOST" >> "$HOME/.ssh/known_hosts"

          ROLE_NAME="codex_read_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          TUNNEL_MARKER="codex-db-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/id_admin_cleanup" \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            bash -s -- "$DB_CONTAINER" "$ROLE_NAME" "$TUNNEL_MARKER" <<'REMOTE'
          set -Eeuo pipefail
          DB_CONTAINER="$1"
          ROLE_NAME="$2"
          TUNNEL_MARKER="$3"
          [[ "$DB_CONTAINER" =~ ^[A-Za-z0-9_.-]+$ ]]
          [[ "$ROLE_NAME" =~ ^codex_read_[0-9_]+$ ]]
          [[ "$TUNNEL_MARKER" =~ ^codex-db-[0-9-]+$ ]]

          AUTHORIZED_KEYS="$HOME/.ssh/authorized_keys"
          if [ -f "$AUTHORIZED_KEYS" ]; then
            AUTHORIZED_KEYS_TMP="$(mktemp "$HOME/.ssh/authorized_keys.codex.XXXXXX")"
            awk -v marker="$TUNNEL_MARKER" '$NF != marker' "$AUTHORIZED_KEYS" > "$AUTHORIZED_KEYS_TMP"
            chmod 600 "$AUTHORIZED_KEYS_TMP"
            mv "$AUTHORIZED_KEYS_TMP" "$AUTHORIZED_KEYS"
          fi

          if docker container inspect "$DB_CONTAINER" >/dev/null 2>&1; then
            DB_USER="$(docker exec "$DB_CONTAINER" printenv POSTGRES_USER)"
            DB_NAME="$(docker exec "$DB_CONTAINER" printenv POSTGRES_DB)"
            docker exec -i "$DB_CONTAINER" psql -X -q -v ON_ERROR_STOP=1 \
              -U "$DB_USER" -d "$DB_NAME" -v role_name="$ROLE_NAME" <<'SQL'
            SELECT format('DROP OWNED BY %I', :'role_name')
            WHERE EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'role_name') \gexec
            SELECT format('DROP ROLE %I', :'role_name')
            WHERE EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'role_name') \gexec
            SQL
            REMAINING="$(docker exec -i "$DB_CONTAINER" psql -X -qAt -v ON_ERROR_STOP=1 \
              -U "$DB_USER" -d "$DB_NAME" -v role_name="$ROLE_NAME" <<'SQL'
            SELECT count(*) FROM pg_roles WHERE rolname = :'role_name';
            SQL
            )"
            test "$REMAINING" = 0
          fi
          REMOTE
