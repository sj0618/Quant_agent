name: Deploy QuantAgent from main

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the current main revision through the canonical SSH/rsync release workflow
        required: true
        type: boolean
        default: true
      evidence_s_ref:
        description: Immutable GitHub URL for same-SHA S evidence
        required: false
        type: string
      evidence_s_sha:
        description: Full commit SHA verified by S evidence
        required: false
        type: string
      evidence_r_ref:
        description: Immutable GitHub URL for same-SHA R evidence
        required: false
        type: string
      evidence_r_sha:
        description: Full commit SHA verified by R evidence
        required: false
        type: string
      evidence_o_ref:
        description: Immutable GitHub URL for same-SHA O evidence
        required: false
        type: string
      evidence_o_sha:
        description: Full commit SHA verified by O evidence
        required: false
        type: string
      evidence_c_ref:
        description: Immutable GitHub URL for same-SHA C evidence
        required: false
        type: string
      evidence_c_sha:
        description: Full commit SHA verified by C evidence
        required: false
        type: string
      rollback_drill:
        description: Run a controlled non-production rollback drill instead of deploy
        required: false
        default: false
        type: boolean

# A deployment must never overlap another deployment of the same service. Do not
# cancel an in-progress rollout: its health check and rollback decision are part of
# the release evidence.
concurrency:
  group: quantagent-main-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate frontend and AI contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The frontend test runner uses Node's TypeScript stripping support.
          node-version: 22
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Test and build frontend
        working-directory: fe
        run: |
          npm ci
          npm test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test parse-to-job execution contract
        working-directory: ai
        run: |
          # quant_strategy imports NumPy directly; install it explicitly until the
          # service package's dependency manifest is consolidated.
          python -m pip install --disable-pip-version-check -e . pytest numpy
          pytest -q tests/test_research_contract.py tests/test_research_contract_api.py

  deploy:
    name: Deploy validated main revision via canonical SSH release
    needs: validate
    # The running FE/BE service is deployed by deploy.yml with rsync and explicit
    # process/readiness checks. It is not a Git worktree or a Docker Compose app.
    if: >-
      ${{
        vars.QUANTAGENT_DEPLOY_ENABLED == 'true' &&
        (inputs.deploy || inputs.rollback_drill)
      }}
    uses: ./.github/workflows/deploy.yml
    with:
      evidence_s_ref: ${{ inputs.evidence_s_ref }}
      evidence_s_sha: ${{ inputs.evidence_s_sha }}
      evidence_r_ref: ${{ inputs.evidence_r_ref }}
      evidence_r_sha: ${{ inputs.evidence_r_sha }}
      evidence_o_ref: ${{ inputs.evidence_o_ref }}
      evidence_o_sha: ${{ inputs.evidence_o_sha }}
      evidence_c_ref: ${{ inputs.evidence_c_ref }}
      evidence_c_sha: ${{ inputs.evidence_c_sha }}
      rollback_drill: ${{ inputs.rollback_drill }}
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.QUANTAGENT_DEPLOY_SSH_KEY }}
