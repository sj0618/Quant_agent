[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantagent-strategy"
version = "0.1.0"
description = "Canonical StrategySpec and runtime for QuantAgent"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
